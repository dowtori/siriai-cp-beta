<title>오드타입 캠페인 콘솔</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">

<style>
  html,body{height:100%}
  body{
    margin:0; overflow:auto;                /* 리스트만 스크롤한다 — 화면이 아주 낮을 때만 예외 */
    display:flex; flex-direction:column;
    font-family:'Noto Sans KR','Arimo','Helvetica Neue',Helvetica,Arial,sans-serif;
    background:#f8fafc; color:#0f172a;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'Arimo','Helvetica Neue',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .won{font-family:'Noto Sans KR',sans-serif;font-weight:400;margin-right:.5px}
  .keep{word-break:keep-all}

  .scroll::-webkit-scrollbar{width:9px;height:9px}
  .scroll::-webkit-scrollbar-track{background:#f1f5f9}
  .scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px;border:2px solid #f1f5f9}
  .scroll::-webkit-scrollbar-thumb:hover{background:#94a3b8}
  .scroll::-webkit-scrollbar-corner{background:#f1f5f9}

  /* 표 — 머리글은 붙어 있고 본문만 흐른다 */
  #list thead th{position:sticky;top:0;z-index:2;background:#f4f6f9}
  .stick{position:sticky;left:0;z-index:1}
  #list thead .stick{z-index:3}

  /* 선정 버튼 — 처음 본 사람도 누를 것임을 알게 */
  .selbtn{transition:background .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease}
  .nudge{animation:nudge 1.9s ease-out infinite}
  @keyframes nudge{
    0%   {box-shadow:0 0 0 0 rgba(79,70,229,.42)}
    60%  {box-shadow:0 0 0 7px rgba(79,70,229,0)}
    100% {box-shadow:0 0 0 0 rgba(79,70,229,0)}
  }

  .drawer{visibility:hidden;opacity:0;transition:opacity .22s ease,visibility .22s ease}
  .drawer.open{visibility:visible;opacity:1}
  .drawer > .panel{transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.61,.36,1)}
  .drawer.open > .panel{transform:translateX(0)}

  .sheet{visibility:hidden;opacity:0;transition:opacity .22s ease,visibility .22s ease}
  .sheet.open{visibility:visible;opacity:1}
  .sheet > .panel{transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.61,.36,1)}
  .sheet.open > .panel{transform:translateY(0)}

  .toast{transform:translate(-50%,140%);opacity:0;transition:transform .28s cubic-bezier(.22,.61,.36,1),opacity .28s ease}
  .toast.show{transform:translate(-50%,0);opacity:1}

  th[draggable="true"]{cursor:grab}
  th.dragging{opacity:.35}
  th.drop-left{box-shadow:inset 3px 0 0 0 #4f46e5}
  th.drop-right{box-shadow:inset -3px 0 0 0 #4f46e5}

  /* 낮은 화면에서 위쪽을 눌러 리스트 높이를 지킨다 */
  @media (max-height:820px){
    .tight-h1{font-size:23px !important}
    .tight-kpi{padding-top:.6rem !important;padding-bottom:.6rem !important}
    .tight-kpi .num{font-size:19px !important}
    .tight-rail{padding-top:.6rem !important;padding-bottom:.6rem !important}
  }
  /* 모바일은 한 화면에 담을 수 없다 — 여기서만 페이지 스크롤을 허용 */
  @media (max-width:880px){
    html,body{height:auto}
    body{display:block;overflow:auto}
    main{display:block}
    #listCard{display:block}
    #list{max-height:60vh;min-height:300px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.001ms !important;animation:none !important}
  }
</style>

  <!-- 이 화면에서 유일하게 스크롤되는 곳 -->

<script>
/* ══════════ 데이터 — 후보 8명, 처음 3명은 이미 선정된 상태 ══════════ */
const CREATORS = [

const AV = ['#4f46e5','#0ea5e9','#7c3aed','#0d9488','#db2777','#ea580c','#65a30d','#2563eb'];

  const s = size || 34, col = AV[i % AV.length];
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 36 36" class="shrink-0" aria-hidden="true">'
    + '<circle cx="18" cy="18" r="18" fill="' + col + '" fill-opacity=".12"/>'
    + '<circle cx="18" cy="18" r="17.25" fill="none" stroke="' + col + '" stroke-opacity=".28" stroke-width="1.5"/>'
    + '<text x="18" y="23" text-anchor="middle" font-size="14" font-weight="600" fill="' + col
    + '" font-family="Noto Sans KR,sans-serif">' + esc(c.name.charAt(0)) + '</text></svg>';
}

function renderRail() {
  const parts = [];
  STEPS.forEach((st, i) => {
    const on = st.n === S.step, past = st.n < S.step;
    if (i) parts.push('<div class="flex-1 h-[2px] mx-3 sm:mx-5 rounded-full ' + (past ? 'bg-emerald-300' : 'bg-slate-200') + '"></div>');
    parts.push(
      '<button onclick="setStep(' + st.n + ')" class="flex items-center gap-2.5 text-left shrink-0 group">'
      + '<span class="num w-7 h-7 shrink-0 rounded-full grid place-items-center text-[11px] font-bold transition '
        + (on ? 'bg-indigo-600 text-white ring-4 ring-indigo-100'
        : past ? 'bg-emerald-500 text-white'
               : 'bg-white border border-slate-200 text-slate-400 group-hover:border-slate-300') + '">'
        + (past ? ICON.check : st.n) + '</span>'
      + '<span class="min-w-0"><span class="block text-xs font-bold transition '
        + (on ? 'text-slate-900' : past ? 'text-slate-500' : 'text-slate-400') + '">' + st.label + '</span>'
      + '<span class="hidden sm:block text-[10.5px] text-slate-400 truncate">' + st.sub + '</span></span></button>'
    );
  });
  $('stepRail').innerHTML = parts.join('');
  const st = STEPS[S.step - 1];
  $('phaseBadge').className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full border ' + st.cls;
  $('phaseBadge').textContent = st.badge;
}

function renderColToggles() {
  $('colToggles').innerHTML = [[1,'선정 단계'],[2,'진행 단계'],[3,'완료 · 사후']].map(([p, title]) => {

    return '<div><div class="text-[10.5px] font-semibold text-slate-400 mb-1">' + title + '</div>'

        '<label class="flex items-center gap-2.5 px-1.5 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer text-xs">'
        + '<input type="checkbox" ' + (S.visible.has(k) ? 'checked' : '') + ' onchange="toggleCol(\'' + k + '\')" class="w-3.5 h-3.5 accent-indigo-600 cursor-pointer">'
        + '<span class="text-slate-700">' + COLS[k].label + '</span></label>'
      ).join('') + '</div>';

function renderTable() {
  let th = '<tr class="border-b border-slate-200 text-[11px] font-semibold text-slate-500">';
  th += '<th class="stick py-3 pl-4 pr-2 w-[104px] text-center whitespace-nowrap">선정</th>';
  th += '<th class="stick py-3 px-3 min-w-[176px] text-left whitespace-nowrap" style="left:104px">크리에이터'
      + '<span class="text-[9.5px] font-normal text-slate-300 ml-1">고정</span></th>';
  th += cols().map(k => {
    const c = COLS[k], on = c.phase === S.step;
    return '<th draggable="true" data-key="' + k + '" class="py-3 px-3 text-' + c.align
      + ' whitespace-nowrap select-none ' + (on ? 'text-indigo-700' : 'text-slate-500') + '">'
      + '<span class="inline-flex items-center gap-1.5">' + ICON.grip + c.label + '</span></th>';
  }).join('');
  $('thead').innerHTML = th + '</tr>';

  const list = shown();
  $('tbody').innerHTML = list.map(c => {
    const idx = CREATORS.indexOf(c);
    let tr = '<tr class="group border-b border-slate-100 last:border-0">';
    tr += '<td class="stick bg-white group-hover:bg-slate-50 transition-colors py-2.5 pl-4 pr-2 text-center">' + selBtn(c, idx) + '</td>';
    tr += '<td class="stick bg-white group-hover:bg-slate-50 transition-colors py-2.5 px-3" style="left:104px">'
      + '<div class="flex items-center gap-3">' + avatar(c, idx)
      + '<div class="min-w-0"><div class="text-[13.5px] font-semibold text-slate-900 truncate">' + esc(c.name) + '</div>'
      + '<div class="num text-[11px] text-slate-400 truncate">' + esc(c.handle) + '</div></div></div></td>';
    tr += cols().map(k => cell(c, idx, k)).join('');
    return tr + '</tr>';
  }).join('');

  if (!list.length) {
    $('tbody').innerHTML = '<tr><td colspan="' + (2 + cols().length) + '" class="py-14 text-center text-xs text-slate-400">선정된 크리에이터가 없습니다. 1단계에서 선정 버튼을 누르세요.</td></tr>';
  }
  bindDrag();
}

/* 체크박스가 아니라 버튼 — 처음 세 명은 이미 눌린 상태이고 나머지는 깜빡인다 */
function selBtn(c, idx) {
  if (S.step > 1) {
    return '<span class="inline-flex items-center gap-1 text-[10.5px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-1.5 rounded-lg whitespace-nowrap">'
      + ICON.check + '확정</span>';
  }
  if (c.sel) {
    return '<button onclick="toggleSel(' + idx + ')" class="selbtn inline-flex items-center gap-1 text-[11px] font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-2.5 py-1.5 rounded-lg whitespace-nowrap">'
      + ICON.check + '선정됨</button>';
  }
  return '<button onclick="toggleSel(' + idx + ')" class="selbtn ' + (S.nudge ? 'nudge ' : '')
    + 'inline-flex items-center text-[11px] font-bold text-indigo-600 bg-white border border-indigo-300 hover:bg-indigo-50 px-3 py-1.5 rounded-lg whitespace-nowrap">선정</button>';
}

function cell(c, idx, k) {
  const col = COLS[k];
  const pad = 'py-2.5 px-3 text-' + col.align;
  const blank = '<td class="' + pad + ' bg-slate-50/60"><span class="text-slate-300 text-[13px]">&mdash;</span></td>';
  const quiet = col.phase < S.step;
  const numCls = 'num text-[12.5px] ' + (quiet ? 'text-slate-500' : 'font-semibold text-slate-900');

  switch (k) {
    case 'fol':  return '<td class="' + pad + '"><span class="' + numCls + '">' + kw(c.fol) + '</span></td>';
    case 'er':   return '<td class="' + pad + '"><span class="' + numCls + '">' + c.er.toFixed(1) + '%</span></td>';
    case 'cost': return '<td class="' + pad + '"><span class="' + numCls + '">' + won(c.cost) + '</span></td>';

    case 'code':
      if (S.step === 1) {
        return '<td class="' + pad + '"><label class="inline-flex items-center gap-2 cursor-pointer">'
          + '<input type="checkbox" ' + (c.codeOn ? 'checked' : '') + ' onchange="toggleCode(' + idx + ')" aria-label="' + esc(c.name) + ' 파트너십 코드" class="w-3.5 h-3.5 accent-indigo-600 cursor-pointer">'
          + '<span class="text-[11.5px] ' + (c.codeOn ? 'text-slate-700 font-medium' : 'text-slate-400') + '">' + (c.codeOn ? '발급' : '제외') + '</span></label></td>';
      }
      if (!c.codeOn) return '<td class="' + pad + '"><span class="text-[11px] text-slate-400">제외</span></td>';
      return '<td class="' + pad + '"><button onclick="copy(\'' + c.code + '\')" title="복사"'
        + ' class="group/c inline-flex items-center gap-2 bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-300 pl-2.5 pr-1.5 py-1 rounded-lg transition">'
        + '<span class="mono text-[11px] text-slate-700 group-hover/c:text-indigo-700">' + c.code + '</span>'
        + '<span class="text-slate-300 group-hover/c:text-indigo-500">' + ICON.copy + '</span></button></td>';

    case 'collab':
      /* 선정 단계에서는 '가능 여부', 이후에는 실제 상태 */
      if (S.step === 1) {
        return '<td class="' + pad + '">' + (c.collab === 'ok'
          ? '<span class="text-[10.5px] font-medium text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-full">가능</span>'
          : '<span class="text-[10.5px] font-medium text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full">협의</span>') + '</td>';
      }
      if (c.collab !== 'ok') {
        return '<td class="' + pad + '"><span class="inline-flex items-center gap-1.5 text-[10.5px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-full whitespace-nowrap">'
          + '<span class="relative flex w-1.5 h-1.5"><span class="animate-ping absolute inline-flex w-full h-full rounded-full bg-amber-400 opacity-75"></span>'
          + '<span class="relative inline-flex w-1.5 h-1.5 rounded-full bg-amber-500"></span></span>수락 대기</span></td>';
      }
      return '<td class="' + pad + '"><span class="inline-flex items-center gap-1 text-[10.5px] font-semibold border px-2 py-0.5 rounded-full whitespace-nowrap '
        + (quiet ? 'text-slate-400 bg-slate-50 border-slate-200' : 'text-emerald-700 bg-emerald-50 border-emerald-200') + '">' + ICON.check + '승인</span></td>';

    case 'reuse':
      if (S.step === 1) {
        return '<td class="' + pad + '"><span class="text-[10.5px] font-medium text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-full">가능</span></td>';
      }
      return '<td class="' + pad + '"><span class="inline-block text-[10.5px] font-medium border px-2 py-0.5 rounded-md whitespace-nowrap '
        + (quiet ? 'text-slate-400 bg-slate-50 border-slate-200' : 'text-indigo-700 bg-indigo-50 border-indigo-200') + '">자사몰 · 광고</span></td>';

    case 'up':
      if (S.step === 1) return blank;
      return '<td class="' + pad + '">' + (isUp(c)
        ? '<span class="num text-[12px] ' + (quiet ? 'text-slate-400' : 'text-slate-700 font-medium') + '">' + c.due + '</span>'
        : '<span class="num text-[12px] text-slate-400">' + c.due + '<span class="ml-1 text-[10px]">예정</span></span>') + '</td>';

    case 'content':
      if (!isUp(c)) return blank;
      return '<td class="' + pad + '"><button onclick="toast(\'' + esc(c.name) + ' 릴스를 새 창에서 엽니다.\')"'
        + ' class="inline-flex items-center gap-1.5 text-[11px] font-medium text-slate-700 bg-white hover:bg-slate-50 border border-slate-200 hover:border-slate-300 pl-2 pr-2.5 py-1 rounded-lg transition whitespace-nowrap">'
        + '<span class="text-pink-600">' + ICON.play + '</span>릴스</button></td>';

    case 'src':
      if (!isUp(c)) return blank;
      return '<td class="' + pad + '"><button onclick="dl(\'' + esc(c.name) + '_오드타입_원본.mp4\')" title="원본 내려받기"'
        + ' class="inline-flex w-8 h-8 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-100 hover:bg-indigo-100 transition">' + ICON.down + '</button></td>';

    case 'extra':
      if (!isUp(c)) return blank;
      if (!c.extra.length) return '<td class="' + pad + '"><span class="text-slate-300 text-[13px]">&mdash;</span></td>';
      return '<td class="' + pad + '">' + c.extra.map(p =>
        '<span class="inline-block text-[10.5px] font-medium text-slate-600 bg-slate-100 border border-slate-200 px-1.5 py-0.5 rounded-md mr-1 whitespace-nowrap">' + p + '</span>').join('') + '</td>';

    case 'views': case 'likes': case 'cmts': case 'saves':
      if (!isUp(c)) return blank;
      return '<td class="' + pad + '"><span class="num text-[12.5px] '
        + (k === 'views' ? 'font-semibold text-slate-900' : 'text-slate-600') + '">' + n(c[k]) + '</span></td>';
  }
  return '<td class="' + pad + '"></td>';
}

function setStep(v) {
  if (v === S.step) return;
  if (v > 1 && !selected().length) { toast('먼저 1단계에서 크리에이터를 선정해 주세요.'); return; }
  S.step = v;
  if (!S.touched) S.visible = new Set(PRESET[v]);
  render();
  $('list').scrollTop = 0;
}
function advance() {
  if (S.step === 3) { openSheet('sh-booking'); return; }
  const selN = selected().length, codeN = selected().filter(c => c.codeOn).length;
  const to = S.step + 1;
  setStep(to);
  toast(to === 2 ? selN + '명 선정 확정 · 파트너십 코드 ' + codeN + '건 발급했어요.'
                 : '업로드 ' + selN + '건 완료 처리했어요. 사후처리를 열었습니다.');
}
function toggleSel(i)  { S.nudge = false; CREATORS[i].sel = !CREATORS[i].sel; renderKpis(); renderToolbar(); renderBanner(); renderTable(); }
function toggleCode(i) { CREATORS[i].codeOn = !CREATORS[i].codeOn; renderKpis(); renderToolbar(); renderTable(); }
function toggleCol(k)  { S.touched = true; S.visible.has(k) ? S.visible.delete(k) : S.visible.add(k); renderTable(); }
function resetCols()   { S.touched = false; S.visible = new Set(PRESET[S.step]); renderColToggles(); renderTable(); }

function togglePop(id) {
  const el = $(id), was = el.classList.contains('hidden');
  document.querySelectorAll('[id^="pop"]').forEach(p => p.classList.add('hidden'));
  if (was) { el.classList.remove('hidden'); renderColToggles(); }
}
document.addEventListener('click', e => {
  if (!e.target.closest('#popCols') && !e.target.closest('button[onclick*="popCols"]')) $('popCols').classList.add('hidden');
});

/* 드래그로 열 순서 바꾸기 */
let dragKey = null;
function bindDrag() {
  document.querySelectorAll('#thead th[draggable="true"]').forEach(th => {
    th.ondragstart = e => { dragKey = th.dataset.key; th.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragKey); };
    th.ondragend   = () => { dragKey = null; clearMarks(); th.classList.remove('dragging'); };
    th.ondragover  = e => {
      if (!dragKey || th.dataset.key === dragKey) return;
      e.preventDefault(); clearMarks();
      th.classList.add(S.order.indexOf(dragKey) > S.order.indexOf(th.dataset.key) ? 'drop-left' : 'drop-right');
    };
    th.ondragleave = () => th.classList.remove('drop-left', 'drop-right');
    th.ondrop = e => {
      e.preventDefault();
      const target = th.dataset.key;
      if (!dragKey || target === dragKey) return;
      const from = S.order.indexOf(dragKey);
      S.order.splice(from, 1);
      const at = S.order.indexOf(target);
      S.order.splice(at + (from > at ? 0 : 1), 0, dragKey);
      dragKey = null; renderTable();
    };
  });
}
function clearMarks() { document.querySelectorAll('#thead th').forEach(t => t.classList.remove('drop-left', 'drop-right')); }

/* 드로어 · 시트 */
function closeOthers(id) { document.querySelectorAll('.drawer.open, .sheet.open').forEach(d => { if (d.id !== id) d.classList.remove('open'); }); }
function openDrawer(id) {
  if (id === 'dw-report') buildReport();
  if (id === 'dw-calendar') buildCal();
  closeOthers(id); $(id).classList.add('open');
}
function closeDrawer(id){ $(id).classList.remove('open'); }
function openSheet(id)  { closeOthers(id); $(id).classList.add('open'); setTimeout(() => $('bkBrand') && $('bkBrand').focus(), 320); }
function closeSheet(id) { $(id).classList.remove('open'); }
function bgClose(e, id) { if (e.target === e.currentTarget) $(id).classList.remove('open'); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.drawer.open, .sheet.open').forEach(d => d.classList.remove('open'));
});

/* 복사 · 내려받기 · 토스트 */
function copy(code) {
  const done = () => toast('파트너십 코드 ' + code + ' 복사했어요.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done);
  else done();
}
function dl(file) { toast(file + ' 내려받기를 시작했어요.'); }
function csv() {
  const head = ['크리에이터','핸들','팔로워','참여율','단가','파트너십코드','공동작업자','업로드일','조회수','좋아요','댓글','저장','추가플랫폼','2차활용'];
  const rows = shown().map(c => [c.name, c.handle, c.fol, c.er, c.cost, c.codeOn ? c.code : '',
    c.collab === 'ok' ? '승인' : '수락대기', '2026.' + c.due, c.views, c.likes, c.cmts, c.saves, c.extra.join(' / '), '자사몰·광고']);
  const body = [head].concat(rows).map(r => r.join(',')).join('\n');
  toast('CSV ' + rows.length + '행을 내려받아요. (' + (body.length / 1024).toFixed(1) + 'KB)');
}
let toastT;
function toast(msg) {
  $('toastMsg').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => $('toast').classList.remove('show'), 2600);
}
function book(e) {
  e.preventDefault();
  const brand = $('bkBrand').value.trim();
  closeSheet('sh-booking');

  toast((brand || '요청') + ' 커피챗 신청이 접수됐어요. 영업일 기준 하루 안에 회신드립니다.');
}

function buildReport() {
  const sel = selected();
  if (!sel.length) { $('reportBody').innerHTML = '<p class="text-xs text-slate-400">선정된 크리에이터가 없습니다.</p>'; return; }
  const V = sel.reduce((a, c) => a + c.views, 0);
  const top = sel.slice().sort((a, b) => b.views - a.views).slice(0, 3);
  const max = top[0].views;
  const withExtra = sel.filter(c => c.extra.length);
  $('reportBody').innerHTML =
    '<div class="grid grid-cols-2 gap-2.5">' + [
      ['총 조회수', n(V)], ['좋아요', n(sel.reduce((a, c) => a + c.likes, 0))],
      ['댓글', n(sel.reduce((a, c) => a + c.cmts, 0))], ['저장', n(sel.reduce((a, c) => a + c.saves, 0))]
    ].map(([t, v]) =>
      '<div class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5">'
      + '<div class="text-[10.5px] text-slate-500">' + t + '</div>'
      + '<div class="num text-lg font-bold text-slate-900 mt-0.5">' + v + '</div></div>').join('') + '</div>'
    + '<div><div class="text-xs font-bold text-slate-900 mb-2.5">조회수 상위 ' + top.length + '건</div><div class="space-y-2">'
    + top.map(c =>
      '<div class="flex items-center gap-3">' + avatar(c, CREATORS.indexOf(c), 30)
      + '<div class="flex-1 min-w-0"><div class="flex items-baseline justify-between gap-2">'
      + '<span class="text-xs font-semibold text-slate-900 truncate">' + esc(c.name)
      + ' <span class="num font-normal text-slate-400">' + esc(c.handle) + '</span></span>'
      + '<span class="num text-xs font-bold text-slate-900 shrink-0">' + n(c.views) + '</span></div>'
      + '<div class="h-1.5 bg-slate-100 rounded-full mt-1.5 overflow-hidden"><div class="h-full bg-indigo-500 rounded-full" style="width:'
      + Math.round(c.views / max * 100) + '%"></div></div></div></div>').join('') + '</div></div>'
    + '<div><div class="text-xs font-bold text-slate-900 mb-2.5">추가 플랫폼 게시</div><div class="flex flex-wrap gap-1.5">'
    + (withExtra.length
        ? withExtra.map(c => '<span class="text-[11px] font-medium text-slate-600 bg-white border border-slate-200 px-2.5 py-1.5 rounded-lg">'
            + esc(c.name) + ' <span class="text-slate-400">' + c.extra.join(' · ') + '</span></span>').join('')
        : '<span class="text-[11px] text-slate-400">없음</span>')
    + '</div></div>';
}

function buildCal() {
  const marks = {};
  selected().forEach(c => { marks[parseInt(c.due.split('.')[1], 10)] = c; });
  let h = ['일','월','화','수','목','금','토'].map(d => '<div class="text-[10px] font-semibold text-slate-400 py-1.5">' + d + '</div>').join('');
  h += '<div class="col-span-6"></div>';               /* 2026.08.01 = 토요일 */
  for (let d = 1; d <= 31; d++) {
    const m = marks[d], done = m && isUp(m);
    h += '<div class="min-h-[58px] rounded-lg border p-1.5 text-left ' + (m ? 'bg-white border-slate-200' : 'bg-slate-50/60 border-slate-100') + '">'
      + '<span class="num text-[10.5px] ' + (m ? 'text-slate-700 font-semibold' : 'text-slate-300') + '">' + d + '</span>'
      + (m ? '<div class="mt-1 text-[9.5px] font-medium leading-tight px-1 py-1 rounded border '
          + (done ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-indigo-50 text-indigo-700 border-indigo-200')
          + '">' + esc(m.name) + '</div>' : '') + '</div>';
  }
  $('calGrid').innerHTML = h;
}

render();
